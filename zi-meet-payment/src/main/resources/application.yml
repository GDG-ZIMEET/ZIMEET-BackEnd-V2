spring:
  application:
    name: zi-meet-payment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:payment-api}

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3307/zimeet_payment?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

payment:
  outbox:
    relay:
      delay-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
