global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: zimeet-local

scrape_configs:

  # Prometheus 자체
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------- Application layer ----------------
  # compose 내부 DNS 이름으로 수집. 각 서비스는 actuator/prometheus 노출.
  - job_name: 'core-api'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['core-api']
        type: A
        port: 8080

  - job_name: 'core-worker'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['core-worker']
        type: A
        port: 8080

  - job_name: 'payment-api'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['payment-api']
        type: A
        port: 8081

  - job_name: 'payment-worker'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['payment-worker']
        type: A
        port: 8081

  # ---------------- Data layer ----------------
  - job_name: 'business-db'
    static_configs:
      - targets: ['business-db-exporter:9104']

  - job_name: 'payment-db'
    static_configs:
      - targets: ['payment-db-exporter:9104']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
