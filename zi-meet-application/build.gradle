plugins {
    id 'java-library'
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-web'
	api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	api 'mysql:mysql-connector-java:8.0.30'
	api 'com.h2database:h2:2.2.220'
	api 'org.springframework.boot:spring-boot-starter-data-redis'
	api 'org.springframework.boot:spring-boot-starter-validation'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// security & jwt
	api 'io.jsonwebtoken:jjwt-api:0.11.5'
	api 'io.jsonwebtoken:jjwt-impl:0.11.5'
	api 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	api 'org.springframework.boot:spring-boot-starter-security'

	// websocket
	api 'org.springframework.boot:spring-boot-starter-websocket'
	api 'org.webjars:sockjs-client:1.5.1'
	api 'org.webjars:stomp-websocket:2.3.4'

	api 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5-jakarta:2.17.1'
	api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	api 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// firebase
	api 'com.google.firebase:firebase-admin:9.2.0'
	api 'com.fasterxml.jackson.core:jackson-core:2.16.1'

	// Resilience4j (Circuit Breaker, Retry, Rate Limiter)
	api 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
	api 'org.springframework.boot:spring-boot-starter-aop'

	// openFeign
	api 'org.springframework.cloud:spring-cloud-starter-openfeign:4.0.3'
	api 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	api platform("org.springframework.cloud:spring-cloud-dependencies:2023.0.1")

	api 'com.googlecode.json-simple:json-simple:1.1.1'

	// QueryDSL
	api 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// Monitoring
	api 'org.springframework.boot:spring-boot-starter-actuator'
	api 'io.micrometer:micrometer-registry-prometheus'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
