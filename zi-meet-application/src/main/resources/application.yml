server:
  port: 8080
  shutdown: graceful  # Graceful shutdown 활성화

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 종료 시 진행 중인 요청 완료 대기 시간
    
  datasource:
    jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DEFAULT_SCHEMA:zimeet}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 100
      pool-name: HikariCP-Business

  datasource-lock:
    jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DEFAULT_SCHEMA:zimeet}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: HikariCP-Lock
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: 27017
      database: ${MONGODB_DATABASE:zimeet}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=3600s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
        acknowledge-mode: auto

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  metrics:
    enable:
      jvm:
        memory: true
        gc: true
      system:
        cpu: false
        files: false
        uptime: true
      tomcat: false

jwt:
    secret: ${JWT_SECRET_KEY}
    expiration: 86400000

kakao:
  pay:
    secret-key: DEV67E80F0AE00ADB148D9D81F39875B9CEDFE1B
    cid: TC0ONETIME
    ready-url: https://open-api.kakaopay.com/online/v1/payment/ready
    approve-url: https://open-api.kakaopay.com/online/v1/payment/approve
    inquiry-api-url: https://open-api.kakaopay.com/online/v1/payment/order
    approval-url: ${KAKAO_PAY_APPROVAL_URL:http://localhost:3000/purchase/approve}
    cancel-url: ${KAKAO_PAY_CANCEL_URL:http://localhost:3000/purchase/cancel}
    fail-url: ${KAKAO_PAY_FAIL_URL:http://localhost:3000/purchase/fail}
    connection-timeout: 5000  # Connection Timeout: 5초
    read-timeout: 9000        # Read Timeout: 9초

firebase:
  admin-sdk: ${FIREBASE_ADMIN_SDK_PATH}

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: ERROR

# Resilience4j 설정
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2

        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      kakaoPayApi:
        baseConfig: default
        slidingWindowType: TIME_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 6s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3




  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
    instances:
      kakaoPayApi:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 1000ms

  ratelimiter:
    instances:
      kakaoPayApi:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0s