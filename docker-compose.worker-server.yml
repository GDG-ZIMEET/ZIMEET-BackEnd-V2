services:
  backend-worker-1:
    container_name: backend-worker-1
    image: ${DOCKERHUB_USERNAME}/zimeet-worker:latest
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod,worker
      - MYSQL_USER=${PROD_DB_USERNAME}
      - MYSQL_PASSWORD=${PROD_DB_PASSWORD}
      - MYSQL_URL=jdbc:mysql://${PROD_DB_ENDPOINT}:3306/${PROD_DB_NAME}?serverTimezone=UTC&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    networks:
      - zimeet_network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  backend-worker-2:
    container_name: backend-worker-2
    image: ${DOCKERHUB_USERNAME}/zimeet-worker:latest
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod,worker
      - MYSQL_USER=${PROD_DB_USERNAME}
      - MYSQL_PASSWORD=${PROD_DB_PASSWORD}
      - MYSQL_URL=jdbc:mysql://${PROD_DB_ENDPOINT}:3306/${PROD_DB_NAME}?serverTimezone=UTC&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    networks:
      - zimeet_network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  zimeet_network:
    external: true