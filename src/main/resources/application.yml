spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${DEFAULT_SCHEMA}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 80
      pool-name: HikariCP-Business

  # 네임드 락 전용 DataSource 설정
  datasource-lock:
    url: jdbc:mysql://mysql:3306/${DEFAULT_SCHEMA}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: HikariCP-Lock
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show_sql: false

  data:
    redis:
      host: redis
      port: 6379
    mongodb:
      host: mongodb
      port: 27017
      database: ${MONGODB_DATABASE:zimeet}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=3600s

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  metrics:
    enable:
      jvm:
        memory: true
        gc: true
      system:
        cpu: false
        files: false
        uptime: true
      tomcat: false

jwt:
    secret: ${JWT_SECRET_KEY}
    expiration: 86400000

kakao:
  pay:
    secret-key: DEV67E80F0AE00ADB148D9D81F39875B9CEDFE1B
    cid: TC0ONETIME
    ready-url: https://open-api.kakaopay.com/online/v1/payment/ready
    approve-url: https://open-api.kakaopay.com/online/v1/payment/approve
    approval-url: ${KAKAO_PAY_APPROVAL_URL:http://localhost:3000/purchase/approve}
    cancel-url: ${KAKAO_PAY_CANCEL_URL:http://localhost:3000/purchase/cancel}
    fail-url: ${KAKAO_PAY_FAIL_URL:http://localhost:3000/purchase/fail}

firebase:
  admin-sdk: ${FIREBASE_ADMIN_SDK_PATH}

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: ERROR