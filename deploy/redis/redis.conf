# ZIMEET Redis 설정
# -------------------------------------------------------------------------
# 용도:
#   - Redis Streams 기반 이벤트 전파 (payment → core, outbox relay 대상)
#   - 분산 락 (티켓 재고 예약, outbox relay leader)
#   - 캐시 / 레이트리밋
#
# 정책:
#   - AOF on, everysec → 이벤트 유실 최소화 (Streams 영속성의 핵심)
#   - RDB snapshot 병행 → 복구 시간 단축
#   - maxmemory-policy noeviction → Streams 데이터가 캐시 정책으로 삭제되지 않도록
#     (캐시 영역은 TTL 로만 관리)

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 영속성: AOF + RDB 이중
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# RDB 스냅샷 (보조)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 메모리 정책
maxmemory 192mb
maxmemory-policy noeviction

# 클라이언트 / 느린 로그
slowlog-log-slower-than 10000
slowlog-max-len 256

# 로그
loglevel notice
logfile ""
