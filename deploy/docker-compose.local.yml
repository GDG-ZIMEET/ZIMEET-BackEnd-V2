# 로컬 멀티모듈 구동용 compose
# 2 MySQL (business / payment) + Redis + MongoDB + core/payment 각각 api/worker 프로파일로 기동.
#
# 사용:
#   1) 전체 모듈 빌드 -> ./gradlew :zi-meet-core:bootJar :zi-meet-payment:bootJar
#   2) 컨테이너 기동   -> docker compose -f deploy/docker-compose.local.yml up -d
#   3) 헬스체크       -> curl http://localhost:8080/actuator/health
#                      curl http://localhost:8081/actuator/health
services:

  business-db:
    image: mysql:8.0
    container_name: zimeet-business-db
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: zimeet_business
    ports:
      - "3306:3306"
    volumes:
      - business_db_data:/var/lib/mysql
    networks: [zimeet_local]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  payment-db:
    image: mysql:8.0
    container_name: zimeet-payment-db
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: zimeet_payment
    ports:
      - "3307:3306"
    volumes:
      - payment_db_data:/var/lib/mysql
    networks: [zimeet_local]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: zimeet-redis
    ports:
      - "6379:6379"
    networks: [zimeet_local]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: zimeet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks: [zimeet_local]

  core-api:
    image: zi-meet-core:local
    container_name: zimeet-core-api
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_NAME: zi-meet-core
    environment:
      SPRING_PROFILES_ACTIVE: core-api
      DB_HOST: business-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_HOST: mongodb
      PAYMENT_SERVER_URL: http://payment-api:8081
    depends_on:
      business-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8080:8080"
    networks: [zimeet_local]

  core-worker:
    image: zi-meet-core:local
    container_name: zimeet-core-worker
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_NAME: zi-meet-core
    environment:
      SPRING_PROFILES_ACTIVE: core-worker
      DB_HOST: business-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_HOST: mongodb
    depends_on:
      business-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [zimeet_local]

  payment-api:
    image: zi-meet-payment:local
    container_name: zimeet-payment-api
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_NAME: zi-meet-payment
    environment:
      SPRING_PROFILES_ACTIVE: payment-api
      PAYMENT_DB_URL: jdbc:mysql://payment-db:3306/zimeet_payment?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      PAYMENT_DB_USERNAME: root
      PAYMENT_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
    depends_on:
      payment-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8081:8081"
    networks: [zimeet_local]

  payment-worker:
    image: zi-meet-payment:local
    container_name: zimeet-payment-worker
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_NAME: zi-meet-payment
    environment:
      SPRING_PROFILES_ACTIVE: payment-worker
      PAYMENT_DB_URL: jdbc:mysql://payment-db:3306/zimeet_payment?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      PAYMENT_DB_USERNAME: root
      PAYMENT_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
    depends_on:
      payment-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [zimeet_local]

networks:
  zimeet_local:
    driver: bridge

volumes:
  business_db_data:
  payment_db_data:
  mongodb_data:
