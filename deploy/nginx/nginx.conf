user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 프로덕션 수준 로그 포맷
    log_format  json escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote":"$remote_addr",'
          '"method":"$request_method",'
          '"path":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"rt":$request_time,'
          '"upstream":"$upstream_addr",'
          '"upstream_rt":"$upstream_response_time",'
          '"ua":"$http_user_agent",'
          '"fwd":"$http_x_forwarded_for"'
        '}';

    access_log  /var/log/nginx/access.log  json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # gzip
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain application/json application/javascript text/css application/xml;

    # 업스트림 정의 (core/payment-api 서비스 DNS 이름으로 round-robin)
    upstream core_api {
        least_conn;
        server core-api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream payment_api {
        least_conn;
        server payment-api:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
