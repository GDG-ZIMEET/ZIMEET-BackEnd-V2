spring:
  datasource:
    jdbc-url: jdbc:h2:mem:localdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 100
      pool-name: HikariCP-Business

  datasource-lock:
    jdbc-url: jdbc:h2:mem:localdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      pool-name: HikariCP-Lock

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis / MongoDB / RabbitMQ / WebSocket 자동 설정 제외 (로컬 테스트용)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitStreamTemplateAutoConfiguration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=3600s

jwt:
  secret: local-secret-key-for-testing-purpose-only-minimum-256-bits-long
  expiration: 86400000

kakao:
  pay:
    secret-key: DEV67E80F0AE00ADB148D9D81F39875B9CEDFE1B
    cid: TC0ONETIME
    ready-url: https://open-api.kakaopay.com/online/v1/payment/ready
    approve-url: https://open-api.kakaopay.com/online/v1/payment/approve
    inquiry-api-url: https://open-api.kakaopay.com/online/v1/payment/order
    approval-url: http://localhost:3000/purchase/approve
    cancel-url: http://localhost:3000/purchase/cancel
    fail-url: http://localhost:3000/purchase/fail
    connection-timeout: 5000
    read-timeout: 10000

firebase:
  admin-sdk: /tmp/firebase-dummy.json

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true

scheduling:
  enabled: false

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: ERROR
    org.hibernate: ERROR
