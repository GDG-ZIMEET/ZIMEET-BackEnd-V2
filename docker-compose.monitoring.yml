services:
  zimeet-prometheus:
    image: prom/prometheus:latest
    container_name: zimeet-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9092:9090"
    networks:
      - zimeet_network
    restart: always

  zimeet-grafana:
    image: grafana/grafana:latest
    container_name: zimeet-grafana
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PW}
    ports:
      - "3002:3000"
    networks:
      - zimeet_network
    restart: always
    depends_on:
      - zimeet-prometheus

  zimeet-loki:
    image: grafana/loki:2.9.2
    container_name: zimeet-loki
    ports:
      - "3102:3100"
    volumes:
      - ./loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - zimeet_network
    restart: always

  zimeet-promtail:
    image: grafana/promtail:latest
    container_name: zimeet-promtail
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - zimeet_network
    restart: always
    depends_on:
      - zimeet-loki

  zimeet-mysql-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: zimeet-mysql-exporter
    env_file:
      - .env
    environment:
      - DATA_SOURCE_NAME=${PROD_DB_USERNAME}:${PROD_DB_PASSWORD}@(${PROD_DB_ENDPOINT}:3306)/
    command:
      - '--collect.perf_schema.eventsstatements'
      - '--collect.perf_schema.eventsstatementssum'
      - '--collect.perf_schema.eventswaits'
      - '--collect.info_schema.processlist'
    ports:
      - "9105:9104"
    networks:
      - zimeet_network
    restart: always

  zimeet-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: zimeet-nginx-exporter
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    ports:
      - "9114:9113"
    networks:
      - zimeet_network
    restart: always

  zimeet-rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: zimeet-rabbitmq-exporter
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=zimeet
      - RABBIT_PASSWORD=1234
    ports:
      - "9420:9419"
    networks:
      - zimeet_network
    restart: always

  zimeet-redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: zimeet-redis-exporter
    environment:
      - REDIS_ADDR=redis1:6379
    ports:
      - "9122:9121"
    networks:
      - zimeet_network
    restart: always

networks:
  zimeet_network:
    external: true

volumes:
  prometheus-storage:
  grafana-storage:
  loki-storage:
